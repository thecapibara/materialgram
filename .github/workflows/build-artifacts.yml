name: Build Materialgram

on:
  push:
    branches:
      - feat/*
      - main
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: materialgram:build

    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6
        with:
          tool-cache: true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Pull Docker build environment
        run: |
          docker pull ghcr.io/telegramdesktop/tdesktop/centos_env
          docker tag ghcr.io/telegramdesktop/tdesktop/centos_env $IMAGE_TAG

      - name: Build Materialgram
        run: |
          API_ID="${{ secrets.API_ID }}"
          API_HASH="${{ secrets.API_HASH }}"
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "API credentials not found in secrets, using test API credentials"
            API_FLAGS="-D TDESKTOP_API_TEST=ON"
          else
            echo "Using custom API credentials from secrets"
            API_FLAGS="-D TDESKTOP_API_ID=$API_ID -D TDESKTOP_API_HASH=$API_HASH"
          fi

          docker run --rm \
            -u $(id -u) \
            -v $PWD:/usr/src/tdesktop \
            $IMAGE_TAG \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D CMAKE_CONFIGURATION_TYPES=Release \
            -D CMAKE_INSTALL_PREFIX="/usr" \
            $API_FLAGS

      - name: Package binary
        run: |
          mkdir -p package/materialgram
          if [ -d "out/install/usr" ]; then
            cp -r out/install/usr/* package/materialgram/
          fi
          if [ -f "out/Release/materialgram" ]; then
            mkdir -p package/materialgram/bin
            cp out/Release/materialgram package/materialgram/bin/
          fi
          cd package
          tar -czvf ../materialgram-linux-x64.tar.gz materialgram

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: materialgram-linux-x64
          path: materialgram-linux-x64.tar.gz
          retention-days: 14
